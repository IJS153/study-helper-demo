<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수스로 체험판 안내</title>
<style>
body { font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; margin: 0; background: #FAFAFA; color: #17171A; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px; line-height: 1.6; }
h1 { font-size: 24px; }
.btn { display: inline-block; padding: 14px 24px; border-radius: 14px; background: #1B63D8; color: #fff; font-weight: 700; text-decoration: none; }
.note { background: #FFF4CC; color: #4A3800; border: 1px solid #E8C65A; border-radius: 14px; padding: 12px 16px; font-weight: 700; }
a { color: #12468F; }
@media (prefers-color-scheme: dark) { body { background: #121214; color: #F1F1F4; } a { color: #AECDFF; } }
</style>
</head>
<body>
<main>
<h1>수스로 체험판</h1>
<p class="note">체험판 — 미리 준비한 예시로 화면 흐름만 보여 드려요. 실제 AI는 쓰지 않아요.</p>
<p>내 수업 자료로 요약하고, 묻고, 문제를 푸는 앱의 화면을 서버 없이 체험해 볼 수 있어요. 올린 파일은 어디에도 보내지 않아요.</p>
<p><a class="btn" href="demo/">체험판 열기</a></p>
<p>진짜 AI가 도는 버전은 발표에서 직접 실행해 보여 드려요.</p>
</main>
</body>
</html>
